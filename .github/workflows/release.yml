name: Build wheels

on:
  schedule:
    - cron: '42 8 2-30/2 * *' # At 08:42 UTC on every 2nd day-of-month
  pull_request:
    paths:  # only run this with PRs that touch these files
      - ".github/workflows/release.yml"
      - "scripts/build_lib.*"
      - "pyproject.toml"
      - "setup.py"
  push:
    branches:
      - main
      # feature branches: wheels are also published to a "branch-<name>"
      # pre-release, so the branch can be installed with pip (see BUILD.md)
      - "feat*"
      - "feat*/**"
    tags:
      - "*"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          arch: x86_64
        - os: ubuntu-22.04
          arch: aarch64
        - os: windows-2022
          arch: AMD64
        - os: macos-14
          arch: arm64
          macosx_deployment_target: "14.0"
          cmake_osx_architectures: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Stamp branch version
        if: >-
          github.ref_type == 'branch' && github.ref_name != 'main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/stamp_branch_version.py "${{ github.ref_name }}" "${{ github.run_number }}"

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install MinGW-w64 tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-lapack
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja

      - name: Build pestutils (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          LDFLAGS: -static-libgcc -static-libgfortran -static-libquadmath -Wl,-Bstatic,--whole-archive -lwinpthread -Wl,--no-whole-archive
        run: bash scripts/build_lib.sh

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_MACOS:
            FC=gfortran-13
            MACOSX_DEPLOYMENT_TARGET='${{ matrix.macosx_deployment_target }}'
            CMAKE_OSX_ARCHITECTURES='${{ matrix.cmake_osx_architectures }}'

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish_branch_wheels:
    name: Publish branch wheels to a GitHub pre-release
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: >-
      github.ref_type == 'branch' && github.ref_name != 'main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true

      - name: Replace the branch pre-release
        run: |
          tag="branch-${GITHUB_REF_NAME//\//-}"
          version=$(ls dist/*.whl | head -n 1 | xargs basename | cut -d- -f2)
          url="https://github.com/${GH_REPO}/releases/expanded_assets/${tag}"
          cat > notes.md <<EOF
          Wheels built from branch \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}, version \`${version}\`.
          These include the pestutils shared library. Install with:

          \`\`\`
          pip install -U pypestutils --find-links ${url}
          \`\`\`
          EOF
          # one rolling pre-release per branch, holding only the latest wheels
          gh release delete "${tag}" --cleanup-tag --yes || true
          gh release create "${tag}" dist/*.whl --prerelease --latest=false \
            --target "${GITHUB_SHA}" --title "Branch ${GITHUB_REF_NAME}" --notes-file notes.md

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v6
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
